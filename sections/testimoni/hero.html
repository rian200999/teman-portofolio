<section class="tk-hero"
    style="position: relative; overflow: hidden; padding: 80px 20px 80px; background-color: var(--tp-darkest); background-image: radial-gradient(var(--tp-border) 1px, transparent 1px); background-size: 24px 24px;">

    <!-- Efek Floating Glow (Lilac & Biru Elektrik) -->
    <div
        style="position: absolute; top: -50px; left: -10%; width: 300px; height: 300px; background: var(--tp-green); border-radius: 50%; filter: blur(100px); opacity: 0.6; z-index: 1;">
    </div>
    <div
        style="position: absolute; bottom: -50px; right: -10%; width: 400px; height: 400px; background: rgba(1, 61, 196, 0.15); border-radius: 50%; filter: blur(120px); opacity: 0.8; z-index: 1;">
    </div>

    <div class="container text-center" style="position: relative; z-index: 2;">
        <!-- Badge dengan Bintang -->
        <div class="tp-section-badge badge-lilac" data-aos="fade-down"
            style="display: inline-flex; align-items: center; gap: 6px; background: var(--tp-dark); border: 1px solid var(--tp-border); color: var(--tp-text-main); box-shadow: 0 4px 12px rgba(226, 211, 244, 0.4);">
            <i class='bx bxs-star' style="color: #F59E0B;"></i>
            <i class='bx bxs-star' style="color: #F59E0B;"></i>
            <i class='bx bxs-star' style="color: #F59E0B;"></i>
            <i class='bx bxs-star' style="color: #F59E0B;"></i>
            <i class='bx bxs-star' style="color: #F59E0B;"></i>
            <span style="font-weight: 800; margin-left: 4px;">4.9/5 Rata-rata Kepuasan</span>
        </div>

        <h1 data-aos="fade-up" data-aos-delay="100"
            style="font-size: 48px; font-weight: 900; color: var(--tp-text-main); margin-top: 24px; margin-bottom: 20px; line-height: 1.2; letter-spacing: -1px;">
            Di-Ghosting HRD? <br><span style="color: var(--tp-light);">Mereka Udah Enggak</span>
        </h1>

        <p data-aos="fade-up" data-aos-delay="200"
            style="font-size: 17px; color: var(--tp-text-muted); max-width: 680px; margin: 0 auto 32px auto; line-height: 1.6;">
            Jangan biarin karyamu numpuk jadi PDF kaku. Intip koleksi web portofolio mereka dan buktikan sendiri kenapa
            TemanPortofolio jadi "Cheat Code" para Job Seeker!
        </p>

        <!-- Interaktif Avatar Group -->
        <div class="ts-avatar-group" data-aos="fade-up" data-aos-delay="300"
            style="display: flex; justify-content: center; align-items: center; gap: 16px; background: var(--tp-dark); padding: 12px 24px; border-radius: 100px; width: fit-content; margin: 0 auto; border: 1px solid var(--tp-border); box-shadow: 0 10px 20px rgba(0,0,0,0.03);">
            <div style="display: flex; margin-right: 4px;">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80"
                    style="width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--tp-dark); margin-left: -12px; z-index: 4;">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&q=80"
                    style="width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--tp-dark); margin-left: -12px; z-index: 3;">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80"
                    style="width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--tp-dark); margin-left: -12px; z-index: 2;">
                <div
                    style="width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--tp-dark); margin-left: -12px; z-index: 1; background: var(--tp-green); color: var(--tp-light); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">
                    99+</div>
            </div>
            <div
                style="text-align: left; font-size: 13px; color: var(--tp-text-muted); font-weight: 600; line-height: 1.4;">
                Telah dipercaya oleh<br><span style="color: var(--tp-text-main);">Ratusan Fresh Grad &
                    Profesional</span>
            </div>
        </div>
    </div>
</section>
