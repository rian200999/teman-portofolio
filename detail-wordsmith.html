<body>
    <!-- NAVBAR INJECTION POINT -->
    <div id="navbar-placeholder"></div>

    <main id="detail-content"></main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/katalog/detail-kategori.js"></script>
    <script src="assets/js/katalog/w-basic-controller.js"></script>
    <script src="assets/js/katalog/w-premium-controller.js"></script>
    <script src="assets/js/katalog/w-pro-controller.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/navbar.js"></script>

    <script>
        const loadSection = async (containerId, filePath) => {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const htmlText = await response.text();
                const container = document.getElementById(containerId);
                if (container) { container.insertAdjacentHTML('beforeend', htmlText); }
            } catch (error) { console.warn(`Gagal memuat ${filePath}:`, error.message); }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('components/navbar.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('navbar-placeholder').innerHTML = html;

                    // Re-evaluasi script internal dari navbar.html (biar auto-active nya jalan)
                    const scripts = document.getElementById('navbar-placeholder').querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        newScript.text = script.text;
                        document.body.appendChild(newScript);
                    });
                }
            } catch (error) {
                console.error("Gagal meload navbar:", error);
            }
            await loadSection('detail-content', 'sections/detail-wordsmith/hero.html');
            await loadSection('detail-content', 'sections/detail-wordsmith/basic.html');
            await loadSection('detail-content', 'sections/detail-wordsmith/premium.html');
            await loadSection('detail-content', 'sections/detail-wordsmith/pro.html');
            await loadSection('detail-content', 'components/footer.html');

            if (typeof window.initWBasicController === 'function') window.initWBasicController();
            if (typeof window.initWPremiumController === 'function') window.initWPremiumController();
            if (typeof window.initWProController === 'function') window.initWProController();
            if (typeof window.initColorSwitcher === 'function') window.initColorSwitcher();
            // 3. Init Footer
            if (typeof window.initFooterLogic === 'function') window.initFooterLogic();

            if (typeof AOS !== 'undefined') { AOS.init({ once: true, duration: 800 }); }
        });
    </script>
</body>
